name: Update Kotlin JS lockfile

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.gradle"
      - "**/*.gradle.kts"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check whether an npm declaration changed
        id: npm-change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --unified=0 "$BASE" "$HEAD" -- '*.gradle' '*.gradle.kts' | grep -Eq '^[+-][^+-].*npm\('; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the Kotlin JS lockfile
        if: steps.npm-change.outputs.changed == 'true'
        run: ./gradlew --no-daemon kotlinUpgradeYarnLock

      - name: Commit the updated lockfile
        if: steps.npm-change.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- kotlin-js-store/yarn.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kotlin-js-store/yarn.lock
          git commit -m "Update Kotlin JS yarn lockfile"
          git push
